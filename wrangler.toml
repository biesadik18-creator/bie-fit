name = "bie-fit"
main = "src/index.js"
compatibility_date = "2026-10-26"

[vars]
GEMINI_MODEL = "gemini-2.5-flash"   # ganti jika Google merilis model flash yang lebih baru

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "bie-fit-db"
database_id = "e6340e03-1a2f-4b31-beba-a22c534c3260"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "bie-fit-photos"

[triggers]
crons = ["0 13 * * *"]   # 13:00 UTC = 20:00 WIB, cek target harian

# Secrets (jangan ditulis di sini): GEMINI_API_KEY, FONNTE_TOKEN, AUTH_SECRET
